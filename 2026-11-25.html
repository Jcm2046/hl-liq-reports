<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var msg = document.getElementById('msg'), form = document.getElementById('f'), input = document.getElementById('k');
  function unb64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function say(t, bad){ msg.textContent = t; msg.className = bad ? 'bad' : ''; }
  async function decrypt(pw){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(P.iv)}, key, unb64(P.ct));
    return new TextDecoder().decode(pt);
  }
  async function open(pw, fromLink){
    if (!window.crypto || !crypto.subtle){ say('这个浏览器不支持解密，请换用最新版的 Chrome、Safari 或 Edge。', true); return; }
    say('正在解密…');
    try {
      var html = await decrypt(pw);
      document.open(); document.write(html); document.close();
    } catch (e) {
      say(fromLink ? '链接里的密钥不对，请手动输入密钥。' : '密钥不对，请检查后再试。', true);
      input.focus();
    }
  }
  var m = location.hash.match(/(?:^#|&)k=([^&]+)/);
  if (m) open(decodeURIComponent(m[1]), true);
  form.addEventListener('submit', function(e){ e.preventDefault(); var v = input.value.trim(); if (v) open(v, false); });
})();
</script>
